<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>강서중 학년말 일정판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 도구줄 → 주차 탭 → 주간 시간표(세로 1~7교시, 가로 요일×1·2·3학년) → 보관함·블록 추가. 블록은 교시 칸에 맞춰 끌어 놓는다. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --line:#D5DBE4; --line2:#E7EBF1; --ink:#1B2330; --muted:#5E6878; --accent:#23406E;
  --exp:#DDF0CF; --exp-ink:#2F5A1C; --lec:#D7E5F7; --lec-ink:#1E4479; --etc:#FBE3C8; --etc-ink:#7A4512;
  --hol:#ECEEF2; --warn:#C8372D; --cell:#FAFBFD; --drop:#FFF0A8; --lunch:#F0F2F6;
  --f-display:"Gowun Batang",serif; --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --line:#2E3745; --line2:#242B36; --ink:#E7ECF3; --muted:#9AA5B5; --accent:#8FB0E6;
  --exp:#263A1F; --exp-ink:#B9E0A2; --lec:#1D2D45; --lec-ink:#A9C8F2; --etc:#3D2B19; --etc-ink:#F3C995;
  --hol:#20262F; --warn:#FF7A6E; --cell:#161B23; --drop:#4A4116; --lunch:#1E242D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --line:#2E3745; --line2:#242B36; --ink:#E7ECF3; --muted:#9AA5B5; --accent:#8FB0E6;
  --exp:#263A1F; --exp-ink:#B9E0A2; --lec:#1D2D45; --lec-ink:#A9C8F2; --etc:#3D2B19; --etc-ink:#F3C995;
  --hol:#20262F; --warn:#FF7A6E; --cell:#161B23; --drop:#4A4116; --lunch:#1E242D; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
#app{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12.5px;color:var(--muted);min-width:120px}
.status.err{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:12.5px;color:var(--muted)}
.bar i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.totals{margin-left:auto;display:flex;gap:12px;color:var(--ink);font-variant-numeric:tabular-nums}.totals b{font-weight:600;color:var(--muted)}
.together{display:flex;gap:6px;align-items:center;color:var(--ink)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.wk{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.wk.over{background:var(--drop);color:var(--ink)}
.wk.all{font-weight:600}
.wkhead{position:sticky;left:0;width:max-content;font-weight:600;font-size:13.5px;padding:12px 12px 6px;color:var(--accent)}
.tt+.wkhead{margin-top:10px}
.tt.compact{grid-template-rows:auto auto repeat(7,50px)}
.tt.compact+.wkhead{padding-top:18px}
.wk small{opacity:.75;margin-left:4px}
.ttwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tt{display:grid;grid-template-columns:52px repeat(15,minmax(68px,1fr));grid-template-rows:auto auto repeat(7,64px);min-width:1080px;position:relative}
.h-day{grid-row:1;text-align:center;padding:7px 4px 5px;border-left:2px solid var(--line);font-weight:600;font-size:13px;display:grid;gap:1px}
.h-day .dt{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.h-day .nt{color:var(--warn);font-size:11px;font-weight:600;min-height:14px}
.h-day.hol{background:var(--hol)}
.h-gr{grid-row:2;text-align:center;font-size:11.5px;color:var(--muted);padding:4px 0;border-top:1px solid var(--line);border-left:1px solid var(--line2)}
.h-gr.first{border-left:2px solid var(--line)}
.corner{grid-row:1/3;grid-column:1;border-bottom:1px solid var(--line)}
.h-gr{border-bottom:1px solid var(--line)}
.pl{grid-column:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);border-top:1px solid var(--line2);text-align:center;line-height:1.2}
.pl small{display:block;font-family:var(--f-body);font-size:10px}
.cell{border-top:1px solid var(--line2);border-left:1px solid var(--line2);background:var(--cell)}
.cell.first{border-left:2px solid var(--line)}
.cell.hol{background:var(--hol)}
.cell.p5{border-top:3px double var(--line)}
.cell.over{background:var(--drop)}
.cell.overspan{background:color-mix(in srgb,var(--drop) 55%,var(--cell))}
.block{margin:3px;border-radius:6px;padding:4px 5px;font-size:11.5px;line-height:1.25;cursor:grab;touch-action:none;user-select:none;border:1px solid transparent;overflow:hidden;z-index:2;display:flex;flex-direction:column;gap:1px;min-width:0}
.block b{font-weight:600;overflow-wrap:anywhere}
.block span{font-size:10.5px;opacity:.85}
.block.exp{background:var(--exp);color:var(--exp-ink)}
.block.lec{background:var(--lec);color:var(--lec-ink)}
.block.etc{background:var(--etc);color:var(--etc-ink)}
.block.clash{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.block.dragging{opacity:.3}
.bulk{display:flex;gap:6px;align-items:center}
.bulk select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.h-day[data-date]{cursor:pointer}
.daytray{margin-top:4px;justify-self:center;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.daytray:hover{filter:brightness(1.1)}
body.printview .daytray{display:none}
.h-day.sel{background:var(--drop);box-shadow:inset 0 -3px 0 var(--accent)}
body.printview .bulk{display:none!important}
.hint{font-size:13px;color:var(--ink)}
body.printview .together,body.printview .weeks,body.printview .lower,body.printview .note,body.printview .sub,body.printview .x,body.printview #clash{display:none!important}
body.printview .block{cursor:default}
body.printview .hint{font-size:15px}
.hint kbd{font:inherit;font-weight:700;padding:1px 7px;border:1px solid var(--accent);border-bottom-width:3px;border-radius:5px;color:var(--accent);background:var(--surface)}
@page{size:A4 landscape;margin:8mm}
@media print{
  :root{--bg:#fff;--surface:#fff;--cell:#fff;--ink:#1B2330;--muted:#5E6878;--line:#9AA5B5;--line2:#C9D1DC;--accent:#23406E;--exp:#DDF0CF;--exp-ink:#2F5A1C;--lec:#D7E5F7;--lec-ink:#1E4479;--etc:#FBE3C8;--etc-ink:#7A4512;--hol:#ECEEF2;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bulk,.tools,.together,.weeks,.lower,.note,.editor,.x,.sub,.hint,#clash{display:none!important}
  #app{max-width:none;padding:0;gap:6px}
  .ttwrap{overflow:visible;border:0}
  .tt{min-width:0;grid-template-columns:30px repeat(15,minmax(0,1fr));grid-template-rows:auto auto repeat(7,62px);break-inside:avoid;border:1px solid var(--line)}
  .wkhead{break-before:page;position:static;padding:0 0 4px}
  .wkhead:first-child{break-before:auto}
  .block{font-size:9.5px;margin:2px}.block span{font-size:8.5px}
  h1{font-size:18px}
}

body.exporting #app{max-width:none;width:1400px}
body.exporting .ttwrap{overflow:visible}
body.exporting .x{display:none}
body.exporting .tt.compact{grid-template-rows:auto auto repeat(7,88px)}
body.exporting .block{font-size:13px}
body.exporting .block span{font-size:12px}

.block{position:relative}
.x{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:var(--surface);color:var(--muted);font-size:13px;line-height:18px;padding:0;cursor:pointer;opacity:0;transition:opacity .12s}
.block:hover .x,.block:focus-within .x,.x:focus-visible{opacity:1}
@media (hover:none){.x{opacity:.85}}
.x:hover{color:var(--warn)}
.block b{padding-right:14px}
.trash{border:1px dashed var(--warn);color:var(--warn);border-radius:6px;padding:10px;font-size:12.5px;text-align:center}
.trash strong{margin-right:4px}
.trash.over{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.ghost .x{display:none}
.ghost{position:fixed;pointer-events:none;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.28);width:120px;margin:0}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.lower{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start}
.panel h2{font-size:14px;margin:0}
.tray{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px dashed var(--line);border-radius:6px}
.tray.over{background:var(--drop)}
.tray .block{width:130px;margin:0}
.tray:empty::before{content:"시간표에서 여기로 끌어 놓으면 날짜에서 빠집니다";color:var(--muted);font-size:12.5px;padding:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input[type=text],.row select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.row input[type=text]{min-width:0;flex:1 1 150px}
.chk{display:flex;gap:10px}
.editor{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.editor .inner{max-width:760px;margin:0 auto;display:grid;gap:10px}
.editor h3{margin:0;font-size:15px}
.note{font-size:12.5px;color:var(--muted);margin:0}

<div class="editor" id="editor" hidden><div class="inner">
 <h3 id="eTitle">블록 편집</h3>
 <div class="row"><input type="text" id="eName" aria-label="이름"><input type="text" id="ePeriod" aria-label="교시" style="flex:0 1 140px"><select id="eType" aria-label="유형"><option value="exp">체험</option><option value="lec">강의</option><option value="etc">검사·기타</option></select></div>
 <div class="row"><input type="text" id="ePlace" placeholder="장소" aria-label="장소"></div>
 <div class="row"><button class="btn primary" id="eOk">적용</button><button class="btn" id="eTray">보관함으로</button><button class="btn" id="eDup">복제</button><button class="btn" id="eDel">삭제</button><button class="btn" id="eClose">닫기</button></div>
</div></div>`;
const $=id=>document.getElementById(id);
function setStatus(t,err){const s=$('status');s.textContent=t;s.classList.toggle('err',!!err)}
function commit(mut){history.push(JSON.stringify(state));if(history.length>60)history.shift();mut();dirty=true;$('undo').disabled=false;$('save').disabled=false;setStatus('저장 안 된 변경 있음');render()}

function blockEl(b,bad,inGrid){const d=document.createElement('div');d.className='block '+b.type+(bad.has(b.id)?' clash':'');d.dataset.id=b.id;d.tabIndex=0;
  const h=hours(b.period);d.innerHTML=`<b>${esc(b.name)}</b><span>${inGrid?'':b.grade+'학년 · '}${esc(b.period||'교시 미정')}</span>${h?`<span>${h}시간</span>`:''}<button class="x" type="button" data-del="${b.id}" aria-label="${esc(b.name)} ${b.grade}학년 삭제" title="삭제">×</button>`;
  d.title=`${b.name} / ${b.grade}학년 / ${b.period||''} / ${b.place||''}`;return d}

function render(){
  const bad=clashes();
  // weeks
  $('weeks').innerHTML=`<button class="wk all${week==='all'?' on':''}" data-week="all">전체 보기</button>`+[...Array(6)].map((_,w)=>{const n=state.blocks.filter(b=>b.date&&weekOf(b.date)===w).length;
    return `<button class="wk${w===week?' on':''}" role="tab" aria-selected="${w===week}" data-week="${w}">${md(dayOf(w,0))}~${md(dayOf(w,4))}<small>${n}개</small></button>`}).join('');
  // grid (한 주 또는 전체)
  const wrapEl=$('ttwrap');wrapEl.innerHTML='';const ws=week==='all'?[0,1,2,3,4,5]:[week];
  ws.forEach(w=>{
  if(week==='all'){const hd=document.createElement('div');hd.className='wkhead';hd.textContent=`${w+1}주차 · ${md(dayOf(w,0))}~${md(dayOf(w,4))}`;wrapEl.appendChild(hd)}
  const tt=document.createElement('div');tt.className='tt'+(week==='all'?' compact':'');let h=`<div class="corner"></div>`;
  for(let d=0;d<5;d++){const t=dayOf(w,d),k=iso(t);
    h+=`<div class="h-day${HOL.has(k)?' hol':''}${k===selDate?' sel':''}" data-date="${k}" title="눌러서 이 날짜 선택" style="grid-column:${2+d*3}/span 3"><span>${DOW[d]} <span class="dt">${md(t)}</span></span><span class="nt">${NOTES[k]||''}</span>${k===selDate&&state.blocks.some(b=>b.date===k)?`<button type="button" class="daytray" data-day="${k}">이 날 모두 보관함으로</button>`:''}</div>`;
    for(let g=1;g<=3;g++)h+=`<div class="h-gr${g===1?' first':''}" style="grid-column:${1+d*3+g}">${g}학년</div>`}
  for(let p=1;p<=MAXP;p++){h+=`<div class="pl" style="grid-row:${p+2}">${p}<small>교시</small></div>`;
    for(let d=0;d<5;d++){const k=iso(dayOf(w,d));for(let g=1;g<=3;g++)h+=`<div class="cell${g===1?' first':''}${HOL.has(k)?' hol':''}${p===5?' p5':''}" style="grid-row:${p+2};grid-column:${1+d*3+g}" data-drop="${k}|${g}|${p}"></div>`}}
  tt.innerHTML=h;
  // blocks in this w, with side-by-side split when overlapping
  const wkBlocks=state.blocks.filter(b=>b.date&&weekOf(b.date)===w&&range(b.period));
  const cols={};wkBlocks.forEach(b=>{const d=(Date.parse(b.date+'T00:00:00Z')-START)/864e5-w*7;if(d<0||d>4)return;(cols[d+'|'+b.grade]??=[]).push(b)});
  Object.entries(cols).forEach(([key,list])=>{const [d,g]=key.split('|').map(Number);
    list.sort((a,b)=>range(a.period)[0]-range(b.period)[0]);const lanes=[];
    list.forEach(b=>{const r=range(b.period);let i=lanes.findIndex(end=>end<r[0]);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=r[1];b._lane=i});
    list.forEach(b=>{const r=range(b.period);const n=list.filter(o=>{const q=range(o.period);return q[0]<=r[1]&&r[0]<=q[1]}).reduce((m,o)=>Math.max(m,o._lane+1),1);
      const el=blockEl(b,bad,true);const s=Math.max(1,r[0]),e=Math.min(MAXP,r[1]);
      el.style.gridColumn=String(1+d*3+g);el.style.gridRow=`${s+2}/${e+3}`;
      if(n>1){el.style.width=`calc(${100/n}% - 6px)`;el.style.marginLeft=`calc(${100*b._lane/n}% + 3px)`}
      tt.appendChild(el)})});
  wrapEl.appendChild(tt)});
  const tray=$('tray');tray.innerHTML='';state.blocks.filter(b=>!b.date||!range(b.period)).sort((a,b)=>a.name.localeCompare(b.name,'ko')||a.grade-b.grade).forEach(b=>tray.appendChild(blockEl(b,bad)));
  $('clash').textContent=bad.size?`확인 필요 ${bad.size}개`:'';
  fillBulk();$('totals').innerHTML=[1,2,3].map(g=>`<span><b>${g}학년</b> ${state.blocks.filter(b=>b.date&&b.grade===g).reduce((s,b)=>s+hours(b.period),0)}시간</span>`).join('');
}
$('weeks').addEventListener('click',e=>{const t=e.target.closest('[data-week]');if(t){week=t.dataset.week==='all'?'all':+t.dataset.week;render()}});
function removeBlock(id){const b=state.blocks.find(x=>x.id===id);if(!b)return;commit(()=>{state.blocks=state.blocks.filter(x=>x.id!==id)});setStatus(`${b.name}(${b.grade}학년) 삭제함 · 되돌리기 가능`)}
document.addEventListener('click',e=>{const x=e.target.closest('.x');if(x){e.stopPropagation();removeBlock(x.dataset.del)}});

/* ---- drag ---- */
let drag=null,wkTimer=null;
function clearOver(){document.querySelectorAll('.over,.overspan').forEach(x=>x.classList.remove('over','overspan'))}
document.addEventListener('pointerdown',e=>{if(document.body.classList.contains('printview'))return;if(e.target.closest('.x'))return;const el=e.target.closest('.block');if(!el||e.button>0)return;
  drag={el,id:el.dataset.id,x:e.clientX,y:e.clientY,started:false,target:null};el.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;
  if(!drag.started){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;drag.started=true;
    const g=drag.el.cloneNode(true);g.className='block ghost '+drag.el.classList[1];g.style.cssText='';document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');$('editor').hidden=true}
  drag.ghost.style.left=(e.clientX-16)+'px';drag.ghost.style.top=(e.clientY-12)+'px';
  const hit=document.elementFromPoint(e.clientX,e.clientY);
  const wk=hit&&hit.closest('[data-week]');
  if(wk){if(!wkTimer)wkTimer=setTimeout(()=>{wkTimer=null;if(drag){week=wk.dataset.week==='all'?'all':+wk.dataset.week;render()}},450);wk.classList.add('over')}
  else if(wkTimer){clearTimeout(wkTimer);wkTimer=null}
  let t=hit&&hit.closest('[data-drop]');
  if(!t&&hit&&hit.closest('.block')&&hit.closest('.tt')){/* over another block: find cell beneath */
    const els=document.elementsFromPoint(e.clientX,e.clientY);t=els.find(x=>x.dataset&&x.dataset.drop)||null}
  clearOver();if(wk)wk.classList.add('over');drag.target=t;
  if(t){if(t.dataset.drop==='tray'||t.dataset.drop==='trash')t.classList.add('over');else{const b=state.blocks.find(x=>x.id===drag.id);const [k,g,p]=t.dataset.drop.split('|');const len=Math.max(1,hours(b.period));
    for(let q=+p;q<Math.min(MAXP,+p+len-1)+1;q++){const c=document.querySelector(`[data-drop="${k}|${g}|${q}"]`);if(c)c.classList.add(q===+p?'over':'overspan')}}}
  const w=$('ttwrap').getBoundingClientRect();if(e.clientX>w.right-40)$('ttwrap').scrollLeft+=14;if(e.clientX<w.left+60)$('ttwrap').scrollLeft-=14;
});
function moveTo(b,k,g,p){const len=Math.max(1,hours(b.period));let s=p,e=p+len-1;if(e>MAXP){e=MAXP;s=Math.max(1,MAXP-len+1)}return {date:k,grade:g,period:pstr(s,e)}}
function endDrag(cancel){if(!drag)return;const d=drag;drag=null;if(wkTimer){clearTimeout(wkTimer);wkTimer=null}clearOver();
  if(!d.started){if(!cancel)openEditor(d.id);return}
  d.ghost.remove();d.el.classList.remove('dragging');if(cancel||!d.target)return;
  const b=state.blocks.find(x=>x.id===d.id);const v=d.target.dataset.drop;
  if(v==='trash'){removeBlock(b.id);return}
  if(v==='tray'){if(b.date)commit(()=>{b.date=null});return}
  const [k,gs,ps]=v.split('|');const g=+gs,p=+ps;const nx=moveTo(b,k,g,p);
  if(nx.date===b.date&&nx.grade===b.grade&&nx.period===b.period)return;
  commit(()=>{
    if($('together').checked&&b.date){const r0=range(b.period);const shift=range(nx.period)[0]-r0[0];
      const sibs=state.blocks.filter(o=>o!==b&&o.name===b.name&&o.date===b.date);
      sibs.forEach(o=>{const r=range(o.period);if(!r)return;let s=r[0]+shift,e=r[1]+shift;if(e>MAXP){s-=e-MAXP;e=MAXP}if(s<1){e+=1-s;s=1}o.date=nx.date;o.period=pstr(s,e)})}
    Object.assign(b,nx)})}
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('block'))openEditor(e.target.dataset.id);if(e.key==='Escape')$('editor').hidden=true});

/* ---- editor ---- */
let editing=null,delArm=false;
function openEditor(id){const b=state.blocks.find(x=>x.id===id);if(!b)return;editing=id;delArm=false;$('eDel').textContent='삭제';
  $('eTitle').textContent=(b.date?label(b.date):'보관함')+` · ${b.grade}학년`;
  $('eName').value=b.name;$('ePeriod').value=b.period||'';$('eType').value=b.type;$('ePlace').value=b.place||'';$('editor').hidden=false;$('eName').focus()}
$('eClose').onclick=()=>{$('editor').hidden=true};
$('eOk').onclick=()=>{const b=state.blocks.find(x=>x.id===editing);if(!b)return;let p=$('ePeriod').value.trim();const r=range(p);if(r)p=pstr(Math.max(1,r[0]),Math.min(MAXP,r[1]));
  commit(()=>{b.name=$('eName').value.trim()||b.name;b.period=p;b.type=$('eType').value;b.place=$('ePlace').value.trim()});$('editor').hidden=true};
$('eTray').onclick=()=>{const b=state.blocks.find(x=>x.id===editing);if(b&&b.date)commit(()=>{b.date=null});$('editor').hidden=true};
$('eDup').onclick=()=>{const b=state.blocks.find(x=>x.id===editing);if(!b)return;commit(()=>{state.blocks.push({...b,id:'b'+Date.now().toString(36),date:null})});$('editor').hidden=true;setStatus('복제한 블록은 보관함에 있습니다')};
$('eDel').onclick=()=>{if(!delArm){delArm=true;$('eDel').textContent='한 번 더 누르면 삭제';return}commit(()=>{state.blocks=state.blocks.filter(x=>x.id!==editing)});$('editor').hidden=true};

$('add').onclick=()=>{const n=$('nName').value.trim();if(!n){$('nName').focus();setStatus('프로그램 이름을 입력하세요',true);return}
  const gs=[1,2,3].filter(g=>$('g'+g).checked);if(!gs.length){setStatus('학년을 하나 이상 고르세요',true);return}
  let p=$('nPeriod').value.trim();const r=range(p);p=r?pstr(Math.max(1,r[0]),Math.min(MAXP,r[1])):'1~2교시';
  commit(()=>{gs.forEach((g,i)=>state.blocks.push({id:'b'+Date.now().toString(36)+i,name:n,type:$('nType').value,grade:g,date:null,period:p,place:''}))});
  $('nName').value='';$('nPeriod').value=''};
$('undo').onclick=()=>{if(!history.length)return;state=JSON.parse(history.pop());$('undo').disabled=!history.length;dirty=true;$('save').disabled=false;setStatus('저장 안 된 변경 있음');render()};

$('copy').onclick=async()=>{const groups={};state.blocks.filter(b=>b.date).forEach(b=>{const k=b.date+'|'+b.name;(groups[k]??=[]).push(b)});
  const lines=Object.keys(groups).sort().map(k=>{const [d,n]=k.split('|');const l=groups[k].sort((a,b)=>a.grade-b.grade);
    const same=l.every(x=>x.period===l[0].period);const h=hours(l[0].period);
    const who=same?(l.length===3?'전교생':l.map(x=>x.grade).join('·')+'학년')+` ${l[0].period}`+(h?`(${h}시간)`:''):l.map(x=>`${x.grade}학년 ${x.period}`).join(', ');
    return `${label(d)} ${n} - ${who}`});
  const un=state.blocks.filter(b=>!b.date);if(un.length)lines.push('','[날짜 미정] '+[...new Set(un.map(b=>b.name))].join(', '));
  const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);setStatus('일정 목록을 복사했습니다')}catch(_){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:200px';$('copy').closest('header').after(ta);ta.select();setStatus('아래 글상자를 복사하세요')}};

let artifact=null;
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){const clean={blocks:state.blocks.map(({_lane,...b})=>b)};const json=JSON.stringify(clean).replace(/</g,'\\u003c');
  const fonts=document.body.querySelector('link[rel=stylesheet]').outerHTML;
  const content=`<title>${esc(TITLE)}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n${fonts}\n<style>${STYLE_SRC}</style>\n<div id="app"></div>\n<script type="application/json" id="plan-data">${json}<\/script>\n<script id="main">${MAIN_SRC}<\/script>`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>${content}</body></html>`}
$('save').onclick=async()=>{if(!artifact){if(!IN_CLAUDE)$('save').title='이 브라우저에 저장됩니다';try{localStorage.setItem('gs-local',JSON.stringify({t:Date.now(),blocks:state.blocks.map(({_lane,...b})=>b)}));dirty=false;$('save').disabled=true;setStatus('이 브라우저에 저장했습니다')}catch(_){setStatus('이 브라우저에서는 저장할 수 없습니다. Claude 안에서 열어 주세요',true)}return}
  $('save').disabled=true;setStatus('저장 중…');
  try{await artifact.publish(buildDoc());dirty=false;setStatus('저장했습니다')}
  catch(err){const c=err&&err.code;if(c==='conflict')setStatus('다른 곳에서 먼저 저장해 새 버전으로 바뀝니다',true);
    else if(c==='not_granted'||c==='not_writer')setStatus('보기 권한만 있어 저장할 수 없습니다',true);
    else{setStatus('저장하지 못했습니다. 다시 눌러 주세요',true);$('save').disabled=false}}};
window.addEventListener('beforeunload',e=>{if(dirty&&artifact){e.preventDefault();e.returnValue=''}});

      x.font='500 30px "IBM Plex Sans KR", sans-serif';x.fillStyle='#23406E';x.fillText(`${i+1}주차 · ${md(dayOf(i,0))} ~ ${md(dayOf(i,4))}`,8,110);
      x.fillStyle='#5E6878';x.font='400 24px "IBM Plex Sans KR", sans-serif';const lg='초록: 체험   파랑: 강의   주황: 검사·기타   빨간 테두리: 교시 겹침·휴일';x.fillText(lg,W-x.measureText(lg).width-8,110);
      x.drawImage(shot,0,top);x.fillText(`학년별 배정 시수: ${gradeTotals()}   ·   출력일 ${new Date().toLocaleDateString('ko-KR')}   ·   ${i+1}/${grids.length}`,8,H-24);
      if(i)doc.addPage('a4','landscape');const pw=297,ph=210,m=8;const r=Math.min((pw-2*m)/W,(ph-2*m)/H);
      doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',(pw-W*r)/2,m,W*r,H*r)}
    const un=state.blocks.filter(b=>!b.date);
    week=prevWeek;document.body.classList.remove('exporting');if(prevTheme===null)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',prevTheme);render();
    if(un.length){const c=document.createElement('canvas');c.width=2400;c.height=1700;const x=c.getContext('2d');x.fillStyle='#FFF';x.fillRect(0,0,2400,1700);
      x.fillStyle='#1B2330';x.font='700 44px "Gowun Batang", serif';x.fillText('날짜 미정 프로그램(보관함)',8,60);x.font='400 30px "IBM Plex Sans KR", sans-serif';
      const groups={};un.forEach(b=>{(groups[b.name]??=[]).push(b.grade)});let y=130;
      Object.entries(groups).forEach(([n,gs])=>{x.fillText(`• ${n} — ${[...new Set(gs)].sort().join('·')}학년${''}`,20,y);y+=50});
      doc.addPage('a4','landscape');doc.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',8,8,281,281*1700/2400)}
    if(print)doc.autoPrint({variant:'javascript'});
    const ok=await offer(`강서중_학년말_일정판_${stamp()}${print?'_인쇄':''}.pdf`,doc.output('blob'));if(ok&&print)setStatus('저장한 PDF를 열면 인쇄 창이 바로 뜹니다')}
  catch(e){setStatus('PDF를 만들지 못했습니다. 다시 눌러 주세요',true)}
  finally{if(document.body.classList.contains('exporting')){week=prevWeek;document.body.classList.remove('exporting');if(prevTheme===null)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',prevTheme);render()}btn.disabled=false}}

if(!IN_CLAUDE){['print','pdflink'].forEach(id=>$(id).addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();if(id==='pdflink')setStatus('인쇄 창에서 대상을 ‘PDF로 저장’으로 고르세요');setTimeout(()=>window.print(),50)},true))}
const handoff=()=>{try{localStorage.setItem('gs-print',JSON.stringify({t:Date.now(),blocks:state.blocks.map(({_lane,...b})=>b)}))}catch(_){}};
$('print').addEventListener('click',handoff);$('pdflink').addEventListener('click',handoff);

/* HWPX: 주차별 시간표(가로 A4) */
let hid=1000;const nid=()=>String(++hid);
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hp(text,ch=0,pp=1,pb=false){return `<hp:p id="${nid()}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${pb?1:0}" columnBreak="0" merged="0"><hp:run charPrIDRef="${ch}">${text?`<hp:t>${xe(text)}</hp:t>`:'<hp:t/>'}</hp:run></hp:p>`}
function hc(paras,col,row,w,h,bf=3,cs=1,rs=1){return `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList><hp:cellAddr colAddr="${col}" rowAddr="${row}"/><hp:cellSpan colSpan="${cs}" rowSpan="${rs}"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="141" right="141" top="85" bottom="85"/></hp:tc>`}
function htable(rows,nc,nr,w,h){return `<hp:p id="${nid()}" paraPrIDRef="1" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0"><hp:tbl id="${nid()}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="NONE" repeatHeader="1" rowCnt="${nr}" colCnt="${nc}" cellSpacing="0" borderFillIDRef="3" noAdjust="0"><hp:sz width="${w}" widthRelTo="ABSOLUTE" height="${h}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="141" right="141" top="85" bottom="85"/>${rows}</hp:tbl><hp:t/></hp:run></hp:p>`}
const BFT={exp:5,lec:6,etc:7};
function weekTable(w,bad){const BW=84188-8504,c0=3600,cw=Math.floor((BW-c0)/15),RH=2700;let rows='<hp:tr>'+hc(hp('교시',2),0,0,c0,1600,4,1,2);
  for(let d=0;d<5;d++){const t=dayOf(w,d),k=iso(t);rows+=hc(hp(`${DOW[d]} ${md(t)}`,2)+(NOTES[k]?hp(NOTES[k],5):''),1+d*3,0,cw*3,1000,HOL.has(k)?8:4,3,1)}
  rows+='</hp:tr><hp:tr>';for(let d=0;d<5;d++)for(let g=1;g<=3;g++)rows+=hc(hp(`${g}학년`,3),d*3+g,1,cw,600,4);rows+='</hp:tr>';
  const skip=new Set();
  for(let p=1;p<=MAXP;p++){rows+='<hp:tr>'+hc(hp(`${p}교시`,2),0,p+1,c0,RH,4);
    for(let d=0;d<5;d++){const k=iso(dayOf(w,d));for(let g=1;g<=3;g++){const col=d*3+g;if(skip.has(col+'|'+p))continue;
      const cover=state.blocks.filter(b=>b.date===k&&b.grade===g&&range(b.period)&&range(b.period)[0]<=p&&p<=range(b.period)[1]);
      if(!cover.length){rows+=hc(hp(''),col,p+1,cw,RH,HOL.has(k)?8:3);continue}
      const b=cover[0],r=range(b.period);let span=1;
      if(cover.length===1&&r[0]===p){const others=state.blocks.filter(o=>o!==b&&o.date===k&&o.grade===g&&range(o.period)&&range(o.period)[0]<=r[1]&&r[0]<=range(o.period)[1]);if(!others.length)span=Math.min(MAXP,r[1])-p+1}
      for(let q=p+1;q<p+span;q++)skip.add(col+'|'+q);
      const text=cover.map(o=>hp(o.name,3)+hp(`${o.period} · ${hours(o.period)}시간`,4)).join('');
      rows+=hc(text,col,p+1,cw,RH*span,cover.length>1||bad.has(b.id)?9:BFT[b.type],1,span)}}
    rows+='</hp:tr>'}
  return htable(rows,16,MAXP+2,c0+cw*15,1600+RH*MAXP)}
function buildSection(){const bad=clashes();let p=`<hp:p id="${nid()}" paraPrIDRef="2" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0">${HWPX.SECPR}<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl></hp:run><hp:run charPrIDRef="0"><hp:t/></hp:run></hp:p>`;
  for(let w=0;w<6;w++){p+=hp(`2026 학년말 진로·자기성장 일정 — ${w+1}주차 (${md(dayOf(w,0))} ~ ${md(dayOf(w,4))})`,1,2,w>0);
    p+=hp('초록: 체험 / 파랑: 강의 / 주황: 검사·기타 / 분홍: 교시 겹침·휴일 배치 확인 필요',4,2);p+=weekTable(w,bad);p+=hp(`학년별 배정 시수: ${gradeTotals()}`,4,2)}
  const un=state.blocks.filter(b=>!b.date);if(un.length){const g={};un.forEach(b=>{(g[b.name]??=[]).push(b.grade)});p+=hp('날짜 미정 프로그램(보관함)',1,2,true);Object.entries(g).forEach(([n,gs])=>{p+=hp(`• ${n} — ${[...new Set(gs)].sort().join('·')}학년`,0,2)})}
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<hs:sec ${HWPX.NS}>${p}</hs:sec>`}
$('hwpx').onclick=async()=>{if(!downloads&&IN_CLAUDE){setStatus('이 화면에서는 파일을 내려받을 수 없습니다. Claude 대화에 "일정판 HWPX로"라고 요청해 주세요',true);return}const btn=$('hwpx');btn.disabled=true;setStatus('HWPX 만드는 중…');
  try{await loadScript(LIB.zip);const title='2026 학년말 진로·자기성장 일정판';
    const hpf=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<opf:package xmlns:opf="http://www.idpf.org/2007/opf/" version="" unique-identifier="" id=""><opf:metadata><opf:title>${xe(title)}</opf:title><opf:language>ko</opf:language></opf:metadata><opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/><opf:item id="settings" href="settings.xml" media-type="application/xml"/></opf:manifest><opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>`;
    const z=new JSZip();const F=z.file.bind(z);z.file=(n,d,o)=>F(n,d,Object.assign({createFolders:false},o||{}));z.file('mimetype','application/hwp+zip',{compression:'STORE'});z.file('version.xml',HWPX.VERSION);z.file('META-INF/container.xml',HWPX.CONTAINER);z.file('META-INF/manifest.xml',HWPX.MANIFEST);
    z.file('Contents/content.hpf',hpf);z.file('Contents/header.xml',HWPX.HEADER);z.file('Contents/section0.xml',buildSection());z.file('settings.xml',HWPX.SETTINGS);z.file('Preview/PrvText.txt',title);
    const hw=await z.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/hwp+zip'});
    const name=`강서중_학년말_일정판_${stamp()}`;const outer=new JSZip();outer.file(name+'.hwpx',hw,{compression:'STORE'});
    await (IN_CLAUDE?offer(name+'_hwpx.zip',await outer.generateAsync({type:'blob'})):offer(name+'.hwpx',hw))}
  catch(e){setStatus('HWPX를 만들지 못했습니다. 다시 눌러 주세요',true)}
  finally{btn.disabled=false}};

let selDate='';
function fillBulk(){const sel=$('bulkDate');const cnt={};state.blocks.forEach(b=>{if(b.date)cnt[b.date]=(cnt[b.date]||0)+1});
  const ds=Object.keys(cnt).sort();if(selDate&&!cnt[selDate])selDate='';
  sel.innerHTML='<option value="">날짜 선택</option>'+ds.map(d=>`<option value="${d}"${d===selDate?' selected':''}>${label(d)} · ${cnt[d]}개</option>`).join('');
  $('bulkTray').disabled=!selDate}
document.addEventListener('change',e=>{if(e.target.id==='bulkDate'){selDate=e.target.value;render()}});
document.addEventListener('click',e=>{const h=e.target.closest('.h-day[data-date]');if(!h||document.body.classList.contains('printview'))return;selDate=selDate===h.dataset.date?'':h.dataset.date;render()});
function sendDay(d){const n=state.blocks.filter(b=>b.date===d).length;if(!n)return;
  commit(()=>{state.blocks.forEach(b=>{if(b.date===d)b.date=null})});selDate='';render();setStatus(`${label(d)} 블록 ${n}개를 보관함으로 보냈습니다 · 되돌리기 가능`)}
document.addEventListener('click',e=>{const t=e.target.closest('.daytray');if(t){e.stopPropagation();sendDay(t.dataset.day);return}if(e.target.id==='bulkTray'&&selDate)sendDay(selDate)},true);

let allArm=null;
$('allTray').addEventListener('click',()=>{const n=state.blocks.filter(b=>b.date).length;if(!n){setStatus('날짜에 놓인 블록이 없습니다');return}
  if(!allArm){$('allTray').textContent=`한 번 더 누르면 ${n}개 이동`;allArm=setTimeout(()=>{allArm=null;$('allTray').textContent='전체 보관함으로'},3000);return}
  clearTimeout(allArm);allArm=null;$('allTray').textContent='전체 보관함으로';
  commit(()=>{state.blocks.forEach(b=>{b.date=null})});selDate='';render();setStatus(`블록 ${n}개를 모두 보관함으로 보냈습니다 · 되돌리기 가능`)});
const PRINTVIEW=location.hash==='#print'||location.hash==='#pdf';
if(PRINTVIEW){try{const d=JSON.parse(localStorage.getItem('gs-print')||'null');if(d&&Array.isArray(d.blocks)&&Date.now()-d.t<30*60*1000)state={blocks:d.blocks}}catch(_){}
  document.body.classList.add('printview');week='all';
  ['save','undo','print','pdflink','hwpx'].forEach(id=>{$(id).hidden=true});
  const hn=document.createElement('span');hn.className='hint';
  hn.innerHTML=location.hash==='#pdf'?'PDF로 저장하려면 <kbd>Ctrl</kbd> + <kbd>P</kbd> 를 누른 뒤 대상을 ‘PDF로 저장’으로 고르세요':'인쇄하려면 <kbd>Ctrl</kbd> + <kbd>P</kbd> 를 누르세요';
  $('print').before(hn);if(location.hash==='#pdf')document.title='강서중 학년말 일정 PDF'}
let preWeek=null;
window.addEventListener('beforeprint',()=>{preWeek=week;week='all';render()});
window.addEventListener('afterprint',()=>{if(preWeek!==null){week=preWeek;preWeek=null;render()}});
render();
(window.claude&&window.claude.use?window.claude.use('artifact'):Promise.resolve(null)).then(a=>{artifact=a;if(a||PRINTVIEW)return;
  try{const d=JSON.parse(localStorage.getItem('gs-local')||'null');if(d&&Array.isArray(d.blocks)&&!dirty){state={blocks:d.blocks};render()}}catch(_){}});
})();
